name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }} ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            platform: windows
            arch: x64
            target: x86_64-pc-windows-msvc
            bundle: nsis
          - runner: macos-15
            platform: macos
            arch: arm64
            target: aarch64-apple-darwin
            bundle: app
          - runner: macos-15-intel
            platform: macos
            arch: x64
            target: x86_64-apple-darwin
            bundle: app
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Verify release version
        run: node -e "if ('v' + require('./package.json').version !== process.env.GITHUB_REF_NAME) process.exit(1)"
      - run: npm ci
      - run: rustup target add ${{ matrix.target }}
      - run: npm run build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundle }} -- --locked
      - name: Prepare macOS download
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist
          ditto -c -k --keepParent "src-tauri/target/${{ matrix.target }}/release/bundle/macos/Browser Game Hub.app" "dist/Browser-Game-Hub-macos-${{ matrix.arch }}.zip"
      - name: Prepare Windows download
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          set -- src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe
          test "$#" -eq 1
          cp "$1" dist/Browser-Game-Hub-windows-x64-setup.exe
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-games-desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0

  publish:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          test -s dist/Browser-Game-Hub-windows-x64-setup.exe
          test -s dist/Browser-Game-Hub-macos-arm64.zip
          test -s dist/Browser-Game-Hub-macos-x64.zip
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "Browser Game Hub $GITHUB_REF_NAME" --generate-notes
