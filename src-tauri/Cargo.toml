[package]
name = "browser-games-desktop"
version = "0.1.2"
description = "Desktop client for Browser Game Hub"
license = "MIT"
edition = "2021"

[lib]
name = "browser_games_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.6", features = [] }

[dependencies]
tauri = { version = "=2.12.7", features = [] }

[profile.release]
opt-level = "s"
lto = "thin"
strip = true
